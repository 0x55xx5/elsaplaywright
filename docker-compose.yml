services:
  postgres:
    image: postgres:15-alpine
    container_name: elsa-postgres
    environment:
      POSTGRES_DB: elsa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  elsa-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: elsa-server
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=postgres;Port=5432;Database=elsa;User Id=postgres;Password=your_password;
    ports:
      - "5000:8080"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
